name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 22+ required — test script uses glob patterns which aren't
        # supported by `node --test` on Node 20. App code itself runs on 20+.
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Check CLI args sync
        # RFC 041 / BL-104 — flag + literal-enum drift between engine/cli.js,
        # engine/commands/*.js, and docs/reference/cli.md. The pre-commit
        # hook is scoped to staged files; CI runs the full-tree scan.
        # Exit 2 is heuristic warning only — surface as a `::warning::`
        # annotation but do not fail. Exit 1 (drift) fails the job.
        run: |
          set +e
          node scripts/check_cli_args_sync.js
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning::cli-args-sync emitted heuristic warnings (see above)."
            exit 0
          fi
          exit "$rc"
      - name: Run tests
        run: npm test
        env:
          # Tests run with no network and no real tokens.
          NODE_ENV: test
